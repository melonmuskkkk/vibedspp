name: Build VibeDSP APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract VibeDSP
        run: |
          mkdir project
          unzip -o VibeDSP_Universal_GitHub_Build.zip -d project

      - name: Build APK
        run: cd project && gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeDSP-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
